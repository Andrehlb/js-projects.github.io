<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas dos Alunos</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        table {
            border: 2px solid #ff5a36;
            border-collapse: collapse;
            width: 420px;
            background: #fff;
        }

        th, td {
            border: 2px solid #ff5a36;
            text-align: center;
            color: #ff5a36;
            padding: 10px;
            height: 38px;
            font-size: 16px;
        }

        thead th {
            font-weight: bold;
        }

        tfoot td {
            text-align: left;
            font-size: 22px;
            padding-left: 12px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>nome</th>
                <th>nota 1</th>
                <th>nota 2</th>
                <th>nota 3</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Alunos do 3º ano</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
